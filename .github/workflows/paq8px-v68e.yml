name: PAQ8PX v68e build
on:
  pull_request:
  workflow_dispatch:
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JohannesBuchner/paq
          path: source
      - name: Build v68e
        run: |
          g++ source/paq8px_v68e/paq8px_v68e.cpp -std=c++17 -DUNIX -DNOASM -O3 -march=x86-64-v3 -mtune=generic -fomit-frame-pointer -s -o paq8px_v68e
          ./paq8px_v68e 2>&1 | head -n 5 || true
          tar --exclude=.git -czf paq8px_v68e_source.tar.gz -C source paq8px_v68e
      - uses: actions/upload-artifact@v4
        with:
          name: paq8px-v68e-linux-source
          path: |
            paq8px_v68e
            paq8px_v68e_source.tar.gz
